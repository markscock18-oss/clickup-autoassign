name: ClickUp Auto Assigner

on:
  schedule:
    - cron: '*/5 * * * *'  # GitHub's minimum; each run then polls every second for ~5 min
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be assigned, change nothing'
        type: boolean
        default: true

# Never run two copies at once (a delayed run could otherwise overlap the next one)
concurrency:
  group: clickup-auto-assign
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python main.py
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_LIST_ID: '901525004358'
          CREATED_AFTER_MS: '1790940825116'  # 2026-10-02 11:33 UTC: only orders created after this are claimed
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          POLL_SECONDS: '1'
          RUN_SECONDS: '285'  # keep polling until the next scheduled run is due
