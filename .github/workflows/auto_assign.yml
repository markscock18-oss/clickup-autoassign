name: ClickUp Auto Assigner

on:
  schedule:
    - cron: '*/15 * * * *'  # keeps a run queued so it starts as soon as the current one ends
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be assigned, change nothing'
        type: boolean
        default: true

# Never run two copies at once (a delayed run could otherwise overlap the next one)
concurrency:
  group: clickup-auto-assign
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      # Bring back what the bot remembers: orders it claimed and the highest order number seen
      - uses: actions/cache/restore@v4
        with:
          path: |
            claimed_ids.txt
            last_serial.txt
          key: bot-memory-${{ github.run_id }}
          restore-keys: bot-memory-
      - run: python main.py
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_LIST_ID: '901525004358'
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          POLL_SECONDS: '1'
          RUN_SECONDS: '20700'  # ~5h45m, just under GitHub's 6-hour job limit
      # Save the memory even when the run is cancelled (turned off)
      - if: always()
        run: touch claimed_ids.txt last_serial.txt
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            claimed_ids.txt
            last_serial.txt
          key: bot-memory-${{ github.run_id }}-${{ github.run_attempt }}
