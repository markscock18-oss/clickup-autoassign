name: Undo Assignments

on:
  workflow_dispatch:

jobs:
  undo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python undo.py
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
